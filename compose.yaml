services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexora
      MYSQL_USER: nexora
      MYSQL_PASSWORD: nexora_local_password
      MYSQL_ROOT_PASSWORD: nexora_local_root
    ports:
      - "3306:3306"
    volumes:
      - nexora_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnexora_local_root"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nexora_mysql:
